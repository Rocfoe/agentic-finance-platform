name: Quantum Stack Validation

on:
  push:
    branches: [main, engage/budget-constraint-graph]
  pull_request:

jobs:
  quantum-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quantum dependencies
        run: python -m pip install --upgrade pip && pip install -r quantum/requirements.txt pytest
      - name: Run VQE tests
        working-directory: quantum
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format check
        working-directory: infrastructure
        run: terraform fmt -check
      - name: Terraform init
        working-directory: infrastructure
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infrastructure
        run: terraform validate
