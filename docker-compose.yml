version: '3.9'
services:
  backend:
    image: node:20
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm init -y >/dev/null 2>&1 && npm install express body-parser uuid tsx typescript @types/express @types/body-parser >/dev/null 2>&1 && npx tsx app.ts"
    ports:
      - "3001:3001"

  agent:
    image: python:3.11
    working_dir: /app
    volumes:
      - ./agent-runtime:/app
    command: python main.py
